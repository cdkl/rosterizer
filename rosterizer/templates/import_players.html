{% extends 'base.html' %}

{% block title %}Import Players{% endblock %}

{% block content %}
<h2>Import Players for {{ session }}</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Import</button>
</form>
<a href="{% url 'session_list' %}" class="btn btn-secondary mt-3">Back to Session List</a>
{% endblock %}
