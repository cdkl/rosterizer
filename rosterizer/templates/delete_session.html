{% extends 'base.html' %}

{% block title %}Delete Session{% endblock %}

{% block content %}
<h1>Are you sure you want to delete this session?</h1>
<p>Year: {{ session.year }}, Session Number: {{ session.session_number }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'session_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
