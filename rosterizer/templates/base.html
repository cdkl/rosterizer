<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Rosterizer{% endblock %}</title>
    
    <!-- Bootstrap CSS with dark theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.6/css/dataTables.bootstrap5.min.css" />
    
    <!-- jQuery -->
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/2.1.6/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.6/js/dataTables.bootstrap5.min.js"></script>
    
    <style>
        body {
            background-color: #212529;
            color: #dee2e6;
            padding: 20px;
        }
        
        a {
            color: #6ea8fe;
        }
        
        a:hover {
            color: #9ec5fe;
        }
        
        table.dataTable {
            color: #dee2e6;
        }
        
        /* Fix striped table rows text color */
        table.table-striped > tbody > tr,
        table.table-striped > tbody > tr > td,
        table.dataTable.table-striped > tbody > tr,
        table.dataTable.table-striped > tbody > tr > td {
            color: #dee2e6 !important;
        }
        
        /* Ensure regular table rows also have proper text color */
        table.table tbody tr td,
        table.dataTable tbody tr td {
            color: #dee2e6;
        }
        
        .dataTables_wrapper .dataTables_filter input,
        .dataTables_wrapper .dataTables_length select {
            background-color: #343a40;
            color: #dee2e6;
            border: 1px solid #495057;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
